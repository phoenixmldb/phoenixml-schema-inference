name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 11 builds (global.json); the 8 and 10 runtimes run the older targets' tests.
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Determine version from git tags
        id: version
        run: |
          # Use latest tag as base version; append commit count since tag for pre-release builds.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE_VERSION="${LATEST_TAG#v}"
          COMMITS_SINCE=$(git rev-list --count "${LATEST_TAG}..HEAD" 2>/dev/null || git rev-list --count HEAD)
          if [ "$COMMITS_SINCE" = "0" ]; then
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}.${COMMITS_SINCE}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (tag: ${LATEST_TAG}, +${COMMITS_SINCE} commits)"

      - name: Restore
        run: dotnet restore

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build -c Release --no-restore -p:Version="$BUILD_VERSION"

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

      - name: Pack
        if: github.event_name == 'push'
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/PhoenixmlDb.Schema.Inference -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" -o ./artifacts

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # The same build and tests on SDK 10. global.json pins SDK 11; this job repoints it, so the
  # projects build net10.0 alone (Directory.Build.props adds net11.0 only on SDK 11). It proves
  # those builds need nothing from SDK 11, and that a host still on SDK 10 can build.
  build-sdk10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Select SDK 10
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open("global.json"))
          g["sdk"] = {"version": "10.0.100", "rollForward": "latestFeature"}
          json.dump(g, open("global.json", "w"), indent=2)
          PY
          dotnet --version
          case "$(dotnet --version)" in 10.*) ;; *) echo "::error::expected SDK 10"; exit 1 ;; esac

      - name: Build
        run: |
          dotnet build -c Release

      - name: Test
        run: |
          dotnet test -c Release --no-build

  publish:
    needs: [build, build-sdk10]
    # Only publish on tagged releases. Untagged main pushes still pack and upload
    # the artifact so it's available for local download + manual publish via
    # `dotnet nuget push --api-key "$PHOENIXML_NUGET_API"` if CI publish ever fails.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 11 builds (global.json); the 8 and 10 runtimes run the older targets' tests.
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
